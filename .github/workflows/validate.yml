name: Validate

on:
  pull_request:

jobs:
  validate:
    name: Validate code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: '**/*.yaml'

      - name: Validate changed files
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          exit_code=0
          for file in ${CHANGED_FILES}; do
            node ./build/validate.js $file || exit_code=$?
          done
          echo 'Downloads:'
          ls ./test/downloads/ || true
          exit $exit_code

      - name: VirusTotal Report
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const yaml = require(path.join(process.cwd(), 'node_modules/js-yaml'));
            const changedFiles = process.env.CHANGED_FILES;
            if (!changedFiles) return;

            // Collect the file urls from the changed package yaml files
            const entries = [];
            for (const file of changedFiles.split(' ')) {
              if (!file.endsWith('.yaml')) continue;
              try {
                const data = yaml.load(fs.readFileSync(file, 'utf8'));
                const pkg = `${data.name || path.basename(path.dirname(path.dirname(file)))} ${data.version || ''}`.trim();
                for (const f of data.files || []) {
                  if (f.url) entries.push({ pkg, url: f.url });
                }
              } catch (e) {
                core.warning(`Could not read ${file}: ${e.message}`);
              }
            }
            if (!entries.length) return;

            // Shared with `npm run dev:validate` (built by the Build step). When VT_API_KEY is available
            // (not on fork PRs) urls VirusTotal has not seen are submitted, otherwise only the links are posted.
            // Opening a Scan link always works: it redirects to the url report and starts a scan if needed.
            const { vtScanUrls } = await import(path.join(process.cwd(), 'build/virustotal.js'));
            const results = await vtScanUrls(
              entries.map(e => e.url),
              { apiKey: process.env.VT_API_KEY, log: m => core.warning(m) },
            );

            let totalFlags = 0;
            let output = 'VirusTotal Report:\n\n| Package | File | Submitted | Result | Scan |\n| --- | --- | --- | --- | --- |\n';
            results.forEach((r, i) => {
              totalFlags += r.flags || 0;
              output += `| ${entries[i].pkg} | ${path.basename(r.url)} | ${r.submitted} | ${r.result} | [VirusTotal](${r.link}) |\n`;
            });
            if (process.env.VT_API_KEY) output += `\nTotal flags: ${totalFlags}\n`;
            output +=
              '\nSubmitted is `unknown` when the status could not be read (for example on a fork PR) and `no` when the url has not been submitted. Opening a Scan link starts a scan if the url has not been scanned yet.\n';

            await core.summary.addRaw(output, true).write();
            // Fork PRs get a read-only token, so commenting may fail
            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.number,
              });
              const existingComment = comments.find(comment => comment.body.includes('VirusTotal Report:'));
              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: output
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.number,
                  body: output
                });
              }
            } catch (e) {
              core.warning(`Could not post comment: ${e.message}`);
            }

      - name: Destination urls
        uses: actions/github-script@v7
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        with:
          script: |
            const changedFiles = process.env.CHANGED_FILES;
            if (!changedFiles) return;

            let output = 'Destination urls:\n';
            const files = changedFiles.split(' ');
            const processedPaths = new Set();

            for (const file of files) {
              const match = file.match(/^src\/(\w+)\/([^/]+)\/([^/]+)\//);
              if (match) {
                const [, registryType, orgSlug, packageSlug] = match;
                const pathKey = `${registryType}/${orgSlug}/${packageSlug}`;
                if (!processedPaths.has(pathKey)) {
                  processedPaths.add(pathKey);
                  output += `Registry: https://open-audio-stack.github.io/open-audio-stack-registry/${registryType}/${orgSlug}/${packageSlug}\n`;
                  output += `Site: https://studiorack.github.io/studiorack-site/${registryType}/${orgSlug}/${packageSlug}\n\n`;
                }
              }
            }

            await core.summary.addRaw(output, true).write();
            // Fork PRs get a read-only token, so commenting may fail
            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.number,
              });
              const existingUrlComment = comments.find(comment => comment.body.includes('Destination urls:'));
              if (existingUrlComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingUrlComment.id,
                  body: output
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.number,
                  body: output
                });
              }
            } catch (e) {
              core.warning(`Could not post comment: ${e.message}`);
            }
