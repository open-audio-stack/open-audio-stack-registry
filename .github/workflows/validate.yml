name: Validate

on:
  pull_request:

jobs:
  validate:
    name: Validate code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: '**/*.yaml'

      - name: Validate changed files
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          exit_code=0
          for file in ${CHANGED_FILES}; do
            node ./build/validate.js $file || exit_code=$?
          done
          echo 'Downloads:'
          ls ./test/downloads/ || true
          exit $exit_code

      - name: VirusTotal Report
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const yaml = require(path.join(process.cwd(), 'node_modules/js-yaml'));
            const changedFiles = process.env.CHANGED_FILES;
            if (!changedFiles) return;

            // Collect the file urls from the changed package yaml files
            const entries = [];
            for (const file of changedFiles.split(' ')) {
              if (!file.endsWith('.yaml')) continue;
              try {
                const data = yaml.load(fs.readFileSync(file, 'utf8'));
                for (const f of data.files || []) {
                  if (f.url) entries.push({ url: f.url, sha256: f.sha256 });
                }
              } catch (e) {
                core.warning(`Could not read ${file}: ${e.message}`);
              }
            }
            if (!entries.length) return;

            // When an API key is available (not on fork PRs), read existing scan results by sha256
            // and submit the url of any file VirusTotal has not seen yet. Failures are only warnings,
            // links below are deterministic so are posted regardless. Public API is limited to 4 requests/min.
            const apiKey = process.env.VT_API_KEY;
            const wait = () => new Promise(resolve => setTimeout(resolve, 15000));
            if (apiKey) {
              for (const entry of entries) {
                try {
                  if (entry.sha256) {
                    const res = await fetch(`https://www.virustotal.com/api/v3/files/${entry.sha256}`, {
                      headers: { 'x-apikey': apiKey },
                    });
                    if (res.ok) {
                      const stats = (await res.json()).data.attributes.last_analysis_stats;
                      entry.flags = stats.malicious + stats.suspicious;
                    } else if (res.status !== 404) {
                      core.warning(`VirusTotal lookup failed (${res.status}): ${entry.url}`);
                    }
                    await wait();
                  }
                  if (entry.flags === undefined) {
                    const res = await fetch('https://www.virustotal.com/api/v3/urls', {
                      method: 'POST',
                      headers: { 'x-apikey': apiKey, 'content-type': 'application/x-www-form-urlencoded' },
                      body: new URLSearchParams({ url: entry.url }),
                    });
                    if (!res.ok) core.warning(`VirusTotal submit failed (${res.status}): ${entry.url}`);
                    entry.submitted = res.ok;
                    await wait();
                  }
                } catch (e) {
                  core.warning(`VirusTotal request failed: ${entry.url} ${e.message}`);
                }
              }
            }

            let output = 'VirusTotal Report:\n';
            for (const entry of entries) {
              const name = path.basename(entry.url);
              let line = entry.sha256 ? `[${name}](https://www.virustotal.com/gui/file/${entry.sha256})` : name;
              if (entry.flags !== undefined) line += ` (${entry.flags} ${entry.flags === 1 ? 'flag' : 'flags'})`;
              else if (entry.submitted) line += ' (scan submitted)';
              output += `- ${line}\n`;
            }
            output += '\nItems not yet scanned by VirusTotal may show as not found.\n';

            await core.summary.addRaw(output, true).write();
            // Fork PRs get a read-only token, so commenting may fail
            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.number,
              });
              const existingComment = comments.find(comment => comment.body.includes('VirusTotal Report:'));
              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: output
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.number,
                  body: output
                });
              }
            } catch (e) {
              core.warning(`Could not post comment: ${e.message}`);
            }

      - name: Destination urls
        uses: actions/github-script@v7
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        with:
          script: |
            const changedFiles = process.env.CHANGED_FILES;
            if (!changedFiles) return;

            let output = 'Destination urls:\n';
            const files = changedFiles.split(' ');
            const processedPaths = new Set();

            for (const file of files) {
              const match = file.match(/^src\/(\w+)\/([^/]+)\/([^/]+)\//);
              if (match) {
                const [, registryType, orgSlug, packageSlug] = match;
                const pathKey = `${registryType}/${orgSlug}/${packageSlug}`;
                if (!processedPaths.has(pathKey)) {
                  processedPaths.add(pathKey);
                  output += `Registry: https://open-audio-stack.github.io/open-audio-stack-registry/${registryType}/${orgSlug}/${packageSlug}\n`;
                  output += `Site: https://studiorack.github.io/studiorack-site/${registryType}/${orgSlug}/${packageSlug}\n\n`;
                }
              }
            }

            await core.summary.addRaw(output, true).write();
            // Fork PRs get a read-only token, so commenting may fail
            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.number,
              });
              const existingUrlComment = comments.find(comment => comment.body.includes('Destination urls:'));
              if (existingUrlComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingUrlComment.id,
                  body: output
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.number,
                  body: output
                });
              }
            } catch (e) {
              core.warning(`Could not post comment: ${e.message}`);
            }

      - name: Notify plugin authors
        uses: actions/github-script@v7
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        with:
          script: |
            const fs = require('fs');
            const changedFiles = process.env.CHANGED_FILES;
            if (!changedFiles) return;

            const pr = context.payload.pull_request;
            const authors = new Set();

            for (const file of changedFiles.split(' ')) {
              if (!file.endsWith('.yaml')) continue;
              try {
                const content = fs.readFileSync(file, 'utf8');
                const match = content.match(/^url:\s*https:\/\/github\.com\/([^\/\n\s]+)/m);
                if (match) authors.add(match[1].toLowerCase());
              } catch (e) {
                core.warning(`Could not read ${file}: ${e.message}`);
              }
            }

            const mentions = [...authors]
              .filter(a => a !== pr.user.login.toLowerCase())
              .map(a => `@${a}`)
              .join(', ');

            if (!mentions) return;

            const body = `Plugin author notification:\n\n${mentions} — your plugin has been submitted to the Open Audio Stack registry. Please review this PR and let us know if the metadata (name, description, tags, files) is correct. To see a full list of all currently added plugins, click <a href="https://studiorack.github.io/studiorack-site/plugins">here</a>.`;

            // Fork PRs get a read-only token, so commenting may fail
            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
              });
              const existing = comments.find(c => c.body.includes('Plugin author notification:'));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body,
                });
              }
            } catch (e) {
              core.warning(`Could not post comment: ${e.message}`);
            }
