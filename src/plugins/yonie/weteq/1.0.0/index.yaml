name: Wet EQ
author: yonie
description: 'An open-source four-band British console equaliser modelled as a circuit: saturation inside the filter loop, per-stage crosstalk, gain-dependent bandwidth. Free, MIT, VST3 for Windows, macOS and Linux.'
