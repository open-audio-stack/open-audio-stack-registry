date: '2025-08-16T15:16:10Z'
changes: |-
  v0.1.4 "The Atmosphere Engine": adds a generative soundscape instrument
  (X/Y pad blending four scenes, each with four granular-looping or
  triggered-event layers), a metronome with BPM double/halve controls, a
  Formant Filter FX, dedicated looper stop/play, and a supercharged MIDI
  mapping system (map notes not just CCs, per-device control channels,
  relative encoder support).
