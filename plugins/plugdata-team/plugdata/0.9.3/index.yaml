name: plugdata
author: plugdata-team
description: A plugin wrapper around Pure Data with a new GUI, allowing visual patching in a wide selection of DAWs. Ships with the ELSE collection of externals and abstractions, and can also be used as a standalone replacement for Pure Data.
license: gpl-3.0
type: tool
tags:
  - Pure Data
  - Patching
  - Visual Programming
  - Modular
url: https://github.com/plugdata-team/plugdata
