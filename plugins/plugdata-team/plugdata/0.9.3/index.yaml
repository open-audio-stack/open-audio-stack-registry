date: '2026-02-14T16:47:44Z'
changes: "New plugdata version, with a few new features, but mostly bugfixes and QoL improvements:\r\n\r\n#### Platform Support\r\n- Added ASIO support for Windows\r\n- Reduced installer sizes for macOS and Windows\r\n- Added Arch and openSUSE arm64 builds\r\n\r\n#### Heavy expo"
